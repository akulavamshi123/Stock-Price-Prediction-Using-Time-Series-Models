<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #43cea2, #185a9d);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 700px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 28px;
            color: green;
            margin: 10px 0;
        }

        .rmse {
            color: #555;
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            border-radius: 10px;
            margin-top: 15px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #43cea2;
            color: white;
            border-radius: 10px;
            text-decoration: none;
        }

        a:hover {
            background: #185a9d;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

<div class="card">

    <h1>{{ stock }} Prediction</h1>

    {% if error %}
        <h2>{{ error }}</h2>
    {% else %}
        <div class="price">💰 ₹ {{ prediction }}</div>
        <div class="rmse">📊 RMSE: {{ rmse }}</div>

        <h3>📈 Price Comparison</h3>
        <img src="/static/{{ graph }}">
    {% endif %}

    <a href="/">🔙 Try Another</a>

</div>

</body>
</html>
